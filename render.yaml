databases:
  - name: krt-db
    plan: free
    region: singapore

services:
  - type: web
    name: krt-ai-terminal
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: krt-db
          property: connectionString
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_CODE
        sync: false
      - key: ANGEL_PIN
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DAILY_LOSS_LIMIT
        value: "5000"
      - key: MAX_CONSECUTIVE_SL
        value: "2"
      - key: COOLDOWN_MINUTES
        value: "30"
      - key: UNIVERSE
        value: "BEL,HINDALCO,VBL,SBIN,TATASTEEL,RELIANCE,INFY,SUNPHARMA,TATAMOTORS,PFC,JSWSTEEL,HDFCBANK"
