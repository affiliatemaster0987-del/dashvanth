<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D14">
<title>KRT AI Option Command Center</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0D14; color: #E8EAF0;
               font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
               -webkit-font-smoothing: antialiased; min-height: 100%; }
  #root { min-height: 100vh; }
  #krt-boot { padding: 28px 20px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; }
  #krt-boot .b { color: #FFA033; letter-spacing: .26em; font-size: 10px; }
  #krt-boot .h { font-size: 16px; font-weight: 700; margin: 8px 0 12px; }
  #krt-boot .m { color: #8A93A6; line-height: 1.7; }
  #krt-boot .e { color: #FF4D5E; background: rgba(255,77,94,.07);
                 border: 1px solid rgba(255,77,94,.33); border-radius: 3px;
                 padding: 12px; margin-top: 10px; line-height: 1.6;
                 white-space: pre-wrap; word-break: break-word; font-size: 11px; }
  #krt-boot .d { color: #8A93A6; background: #12161F; border: 1px solid #232A38;
                 border-radius: 3px; padding: 12px; margin-top: 10px; line-height: 1.6;
                 white-space: pre-wrap; word-break: break-word; font-size: 11px; }
</style>
</head>
<body>

<!-- Boot and error messages live HERE, outside #root.
     React owns #root exclusively; anything else writing into it breaks
     React's DOM bookkeeping with a removeChild error. -->
<div id="krt-boot">
  <div class="b">KRT AI</div>
  <div class="m">Loading the terminal&hellip;</div>
</div>

<div id="root"></div>

<noscript>
  <div style="padding:28px 20px;font-family:monospace;color:#8A93A6">
    This terminal needs JavaScript.
  </div>
</noscript>

<script>
(function () {
  var EXPECT = "v8-1787996136";

  function paint(title, detail, diag) {
    var boot = document.getElementById("krt-boot");
    if (!boot) return;
    boot.style.display = "block";
    boot.textContent = "";
    function add(cls, txt) {
      var d = document.createElement("div"); d.className = cls; d.textContent = txt;
      boot.appendChild(d);
    }
    add("b", "KRT AI"); add("h", title); add("e", detail);
    if (diag) add("d", diag);
  }

  window.addEventListener("error", function (ev) {
    if (window.__KRT_MOUNTED) return;
    if (ev && ev.target && ev.target.tagName === "SCRIPT") {
      paint("The terminal script did not load.",
            "Failed to fetch: " + (ev.target.src || "/static/terminal.js"));
      return;
    }
    paint("The terminal hit a script error.",
          (ev && ev.message ? ev.message : "unknown error") +
          (ev && ev.filename ? "\n\nat " + ev.filename + ":" + ev.lineno + ":" + ev.colno : ""));
  }, true);

  window.addEventListener("unhandledrejection", function (ev) {
    if (window.__KRT_MOUNTED) return;
    paint("The terminal hit an unhandled promise rejection.",
          String((ev && ev.reason && (ev.reason.stack || ev.reason.message)) || ev.reason));
  });

  /* If nothing mounts, do not ask the user to go and check the file by hand.
     Fetch it here and say exactly what came back. */
  setTimeout(function () {
    if (window.__KRT_MOUNTED) return;

    var url = "/static/terminal.js?probe=" + Date.now();
    fetch(url, { cache: "no-store" }).then(function (res) {
      var ct = res.headers.get("content-type") || "unknown";
      return res.text().then(function (body) {
        var lines = [];
        lines.push("HTTP status   : " + res.status + " " + res.statusText);
        lines.push("Content-Type  : " + ct);
        lines.push("Size          : " + body.length.toLocaleString() + " bytes");
        lines.push("Expected build: " + EXPECT);

        var m = body.match(/v8-\d{9,}/);
        lines.push("Build in file : " + (m ? m[0] : "none found"));
        lines.push("");

        var verdict;
        if (res.status === 404) {
          verdict = "static/terminal.js is NOT in the deploy.\n\n" +
            "It was never committed, or .gitignore is excluding it. In the repo run:\n" +
            "    git check-ignore -v static/terminal.js\n" +
            "If that prints a rule, the file is being skipped silently. Force it in with:\n" +
            "    git add -f static/terminal.js && git commit -m \"add bundle\" && git push";
        } else if (/^\s*<!doctype|^\s*<html/i.test(body)) {
          verdict = "The server returned HTML, not JavaScript.\n\n" +
            "The /static route is not serving files — the request fell through to index.html. " +
            "Check that the static/ directory exists in the deploy and app.py still mounts it.";
        } else if (!m) {
          verdict = "A JavaScript file is being served, but it carries no build stamp.\n\n" +
            "That means it is an OLD terminal.js from a previous upload. Replace " +
            "static/terminal.js with the file from the latest zip, commit, and push.";
        } else if (m[0] !== EXPECT) {
          verdict = "STALE BUNDLE.\n\n" +
            "index.html is from build " + EXPECT + " but terminal.js is build " + m[0] + ".\n" +
            "The two files must ship together. Upload BOTH from the same zip, then hard-refresh " +
            "(Ctrl+Shift+R) so the browser drops its cached copy.";
        } else {
          verdict = "The correct file is being served and it parses, but no mount happened.\n\n" +
            "That points to an error thrown while the bundle ran. Open DevTools (F12) and read " +
            "the first red line in the Console.";
        }
        paint("The terminal did not start.", verdict, lines.join("\n"));
      });
    }).catch(function (e) {
      paint("The terminal did not start.",
            "/static/terminal.js could not even be fetched: " + String(e && e.message || e),
            "The server may be asleep or still deploying. Wait a moment and reload.");
    });
  }, 8000);
})();
</script>
<script src="/static/terminal.js?b=v8-1787996136"></script>
</body>
</html>
