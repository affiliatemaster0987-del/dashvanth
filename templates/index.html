<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D14">
<title>KRT AI Option Command Center</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0D14; color: #E8EAF0;
               font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
               -webkit-font-smoothing: antialiased; min-height: 100%; }
  #root { min-height: 100vh; }
  #boot { padding: 40px 20px; text-align: center;
          font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; }
  #boot .b { color: #FFA033; letter-spacing: .26em; font-size: 10px; }
  #boot .m { color: #8A93A6; margin-top: 10px; line-height: 1.7; }
  #boot code { color: #FFA033; }
</style>
</head>
<body>

<div id="root">
  <div id="boot">
    <div class="b">KRT AI</div>
    <div class="m">
      Loading the terminal&hellip;<br>
      If this message stays, <code>/static/terminal.js</code> did not load.<br>
      Open that path directly &mdash; a 404 means the file is missing from the repo.
    </div>
  </div>
</div>

<noscript>
  <div style="padding:40px 20px;text-align:center;font-family:monospace;color:#8A93A6">
    This terminal needs JavaScript.
  </div>
</noscript>

<script src="/static/terminal.js"></script>
</body>
</html>
